<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentorship Application</title>
</head>
<body>
  <main>
    <h1>Mentorship Application</h1>
    <p>Fields marked required must be filled in.</p>

    <!-- POST keeps personal data out of the web address. -->
    <!-- No backend yet, so the action is a placeholder path. -->
    <form action="/mentorship/apply" method="post">

      <fieldset>
        <legend>Personal information</legend>

        <p>
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" name="full_name"
            minlength="2" maxlength="80" required>
        </p>

        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
            maxlength="100" required>
        </p>

        <p>
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone"
            minlength="7" maxlength="15" required>
        </p>

        <p>
          <label for="birth-date">Date of birth</label>
          <input type="date" id="birth-date" name="birth_date"
            min="1940-01-01" max="2010-12-31" required>
        </p>

        <fieldset>
          <legend>Gender</legend>
          <p>
            <input type="radio" id="gender-female" name="gender"
              value="female" required>
            <label for="gender-female">Female</label>
          </p>
          <p>
            <input type="radio" id="gender-male" name="gender"
              value="male">
            <label for="gender-male">Male</label>
          </p>
          <p>
            <input type="radio" id="gender-none" name="gender"
              value="prefer-not-to-say">
            <label for="gender-none">Prefer not to say</label>
          </p>
        </fieldset>
      </fieldset>

      <fieldset>
        <legend>Development information</legend>

        <p>
          <label for="experience">Current experience level</label>
          <select id="experience" name="experience" required>
            <option value="">Choose one</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </p>

        <fieldset>
          <legend>Areas of interest</legend>
          <p>
            <input type="checkbox" id="interest-web" name="interests"
              value="web">
            <label for="interest-web">Web development</label>
          </p>
          <p>
            <input type="checkbox" id="interest-data" name="interests"
              value="data">
            <label for="interest-data">Data and AI</label>
          </p>
          <p>
            <input type="checkbox" id="interest-mobile" name="interests"
              value="mobile">
            <label for="interest-mobile">Mobile apps</label>
          </p>
          <p>
            <input type="checkbox" id="interest-design" name="interests"
              value="design">
            <label for="interest-design">UI design</label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Preferred learning track</legend>
          <p>
            <input type="radio" id="track-frontend" name="track"
              value="frontend" required>
            <label for="track-frontend">Front-end</label>
          </p>
          <p>
            <input type="radio" id="track-backend" name="track"
              value="backend">
            <label for="track-backend">Back-end</label>
          </p>
          <p>
            <input type="radio" id="track-fullstack" name="track"
              value="fullstack">
            <label for="track-fullstack">Full-stack</label>
          </p>
        </fieldset>

        <p>
          <label for="github-url">GitHub profile URL</label>
          <input type="url" id="github-url" name="github_url"
            maxlength="100" pattern="https://github\.com/.+"
            title="Example: https://github.com/your-username">
        </p>

        <p>
          <label for="reason">Why do you want to join?</label>
        </p>
        <p>
          <textarea id="reason" name="reason" rows="5" cols="40"
            minlength="30" maxlength="500" required></textarea>
        </p>
      </fieldset>

      <fieldset>
        <legend>Other</legend>

        <p>
          <label for="availability">Availability</label>
          <select id="availability" name="availability" required>
            <option value="">Choose one</option>
            <option value="weekday-evenings">Weekday evenings</option>
            <option value="weekends">Weekends</option>
            <option value="both">Weekday evenings and weekends</option>
          </select>
        </p>

        <p>
          <input type="checkbox" id="agree-rules" name="agree_rules"
            value="yes" required>
          <label for="agree-rules">
            I agree to the mentorship rules
          </label>
        </p>
      </fieldset>

      <p>
        <button type="submit">Submit application</button>
      </p>
    </form>
  </main>
</body>
</html>
