<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mentorship Application</title>
</head>
<body>

  <h1>Mentorship Application</h1>

  <!--
    action = where the form data is sent (a fake address, because we have no backend)
  method = "post" sends data privately. "get" would show it in the web address.
  -->
  <form action="https://example.com/apply" method="post">

    <!-- GROUP 1: Personal information -->
    <fieldset>
      <legend>Personal information</legend>

      <!-- label "for" must match the input "id" -->
      <p>
        <label for="full-name">Full name:</label><br>
        <input type="text" id="full-name" name="full_name" required minlength="2" maxlength="100">
      </p>

      <p>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="phone">Phone (optional):</label><br>
        <input type="tel" id="phone" name="phone" maxlength="20">
      </p>

      <p>
        <label for="dob">Date of birth:</label><br>
        <input type="date" id="dob" name="date_of_birth" required min="1940-01-01" max="2008-11-24">
      </p>

      <!-- Radio buttons share the same name, so only one can be picked -->
      <fieldset>
        <legend>Gender</legend>

        <input type="radio" id="gender-female" name="gender" value="female" required>
        <label for="gender-female">Female</label><br>

        <input type="radio" id="gender-male" name="gender" value="male">
        <label for="gender-male">Male</label><br>

        <input type="radio" id="gender-none" name="gender" value="prefer-not-to-say">
        <label for="gender-none">Prefer not to say</label>
      </fieldset>
    </fieldset>

    <br>

    <!-- GROUP 2: Development information -->
    <fieldset>
      <legend>Development information</legend>

      <fieldset>
        <legend>Current experience level</legend>

        <input type="radio" id="level-beginner" name="experience_level" value="beginner" required>
        <label for="level-beginner">Beginner</label><br>

        <input type="radio" id="level-intermediate" name="experience_level" value="intermediate">
        <label for="level-intermediate">Intermediate</label><br>

        <input type="radio" id="level-advanced" name="experience_level" value="advanced">
        <label for="level-advanced">Advanced</label>
      </fieldset>

      <!-- Checkboxes let you pick more than one -->
      <fieldset>
        <legend>Areas of interest</legend>

        <input type="checkbox" id="interest-web" name="interests" value="web">
        <label for="interest-web">Web development</label><br>

        <input type="checkbox" id="interest-mobile" name="interests" value="mobile">
        <label for="interest-mobile">Mobile apps</label><br>

        <input type="checkbox" id="interest-ai" name="interests" value="ai">
        <label for="interest-ai">AI and data</label>
      </fieldset>

      <!-- select = dropdown list, option = each item in it -->
      <p>
        <label for="learning-track">Preferred learning track:</label><br>
        <select id="learning-track" name="learning_track" required>
          <option value="">Choose one</option>
          <option value="frontend">Front-end</option>
          <option value="backend">Back-end</option>
          <option value="fullstack">Full-stack</option>
        </select>
      </p>

      <p>
        <label for="github">GitHub profile URL (optional):</label><br>
        <input type="url" id="github" name="github_url" maxlength="200">
      </p>

      <!-- textarea = a big box for longer text -->
      <p>
        <label for="reason">Why do you want to join?</label><br>
        <textarea id="reason" name="reason" rows="5" cols="40" required minlength="30" maxlength="500"></textarea>
      </p>
    </fieldset>

    <br>

    <!-- GROUP 3: Other -->
    <fieldset>
      <legend>Other</legend>

      <p>
        <label for="hours">Hours per week you can give (2 to 40):</label><br>
        <input type="number" id="hours" name="hours_per_week" required min="2" max="40">
      </p>

      <input type="checkbox" id="agree" name="agree_to_rules" value="agreed" required>
      <label for="agree">I agree to the mentorship rules</label>
    </fieldset>

    <br>

    <!-- A real submit button -->
    <button type="submit">Submit application</button>

  </form>

</body>
</html>
